name: Finalize Daily Challenge

on:
  schedule:
    # 12:05 AM Eastern during daylight saving time
    - cron: "5 4 * * *"

  workflow_dispatch:

jobs:
  finalize:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - run: npx tsx scripts/finalizeDailyChallenge.ts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}